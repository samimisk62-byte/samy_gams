<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#101820">

<title>🎾 الحائط الصعب</title>

<style>

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 font-family:Arial,Tahoma,sans-serif;
 background:#101820;
 color:#fff;
 overflow-x:hidden;
}

button,
input,
select{
 font-family:inherit;
}

button{
 border:0;
 border-radius:12px;
 padding:11px 15px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 background:#fff;
 color:#102030;
}

button:active{
 transform:scale(.97);
}

.hidden{
 display:none!important;
}

/* =========================
   القائمة
========================= */

#menu{
 position:fixed;
 inset:0;
 z-index:50;
 overflow:auto;
 background:
 linear-gradient(135deg,#071b2b,#123b55 55%,#071820);
 padding:18px;
}

.menuBox{
 width:min(720px,100%);
 margin:auto;
 background:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.15);
 border-radius:24px;
 padding:20px;
 box-shadow:0 15px 50px rgba(0,0,0,.35);
}

h1{
 text-align:center;
 margin:5px 0 8px;
 font-size:34px;
}

.subtitle{
 text-align:center;
 color:#d7e9f5;
 margin:0 0 18px;
}

.section{
 background:rgba(0,0,0,.16);
 border-radius:16px;
 padding:14px;
 margin:12px 0;
}

.sectionTitle{
 font-size:18px;
 font-weight:bold;
 margin-bottom:10px;
}

.field{
 margin:9px 0;
}

.field label{
 display:block;
 font-weight:bold;
 margin-bottom:6px;
}

input[type="text"],
select{
 width:100%;
 padding:12px;
 border:0;
 border-radius:11px;
 font-size:16px;
 background:#fff;
 color:#102030;
}

.options{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

.option{
 flex:1;
 min-width:100px;
 background:#e7edf2;
}

.option.selected{
 background:#ffd54a;
 color:#201800;
}

#easy.selected{
 background:#86efac;
}

#medium.selected{
 background:#fde68a;
}

#hard.selected{
 background:#fff;
 color:#111;
}

.rangeLine{
 display:flex;
 align-items:center;
 gap:10px;
}

.rangeLine input{
 flex:1;
}

.rangeValue{
 min-width:45px;
 text-align:center;
 font-weight:bold;
}

.startBtn{
 width:100%;
 margin-top:8px;
 padding:15px;
 font-size:19px;
 background:#ffd54a;
 color:#241d00;
}

.secondary{
 background:#93c5fd;
}

.infoButtons{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 margin-top:8px;
}

.homeLink{
 display:block;
 text-align:center;
 margin-top:14px;
 color:#fff;
 text-decoration:none;
 background:rgba(255,255,255,.12);
 padding:12px;
 border-radius:12px;
}

/* =========================
   اللعبة
========================= */

#game{
 display:none;
 min-height:100vh;
 padding:8px;
 background:
 radial-gradient(circle at center,#18394d,#07121a);
}

.hud{
 width:min(1000px,100%);
 margin:auto;
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 justify-content:center;
 gap:6px;
}

.hudBox{
 background:rgba(255,255,255,.10);
 border:1px solid rgba(255,255,255,.14);
 border-radius:11px;
 padding:8px 11px;
 font-weight:bold;
}

.redText{
 color:#ff6b6b;
}

.blueText{
 color:#62a8ff;
}

.controlsTop{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
 margin:5px auto;
}

.controlsTop button{
 padding:8px 11px;
 font-size:14px;
}

#field{
 position:relative;
 width:min(1100px,100%);
 height:min(72vh,620px);
 min-height:380px;
 margin:7px auto 0;
 overflow:hidden;
 border-radius:20px;
 border:3px solid rgba(255,255,255,.3);
 background:
 linear-gradient(
   to bottom,
   #315c70 0%,
   #21495b 47%,
   #193f50 48%,
   #244d5d 100%
 );
 box-shadow:
 0 15px 45px rgba(0,0,0,.45),
 inset 0 0 40px rgba(0,0,0,.22);
 touch-action:none;
}

/* الأرض */

.floorLine{
 position:absolute;
 left:0;
 right:0;
 top:50%;
 height:2px;
 background:rgba(255,255,255,.18);
}

/* الحائط */

#wall{
 position:absolute;
 top:8px;
 left:2%;
 width:96%;
 height:52px;
 border-radius:7px;
 background:
 linear-gradient(#dce3e7,#9ba8af);
 border:3px solid #f3f6f7;
 box-shadow:
 0 7px 12px rgba(0,0,0,.35),
 inset 0 4px 8px rgba(255,255,255,.65);
 z-index:4;
}

.wallMark{
 position:absolute;
 left:50%;
 top:0;
 transform:translateX(-50%);
 width:5px;
 height:100%;
 background:#333;
 opacity:.7;
}

/* الشبكات */

.net{
 position:absolute;
 top:15%;
 width:75px;
 height:70%;
 border-radius:12px;
 z-index:2;
 box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.net.red{
 right:2%;
 background:
 repeating-linear-gradient(
  0deg,
  rgba(255,255,255,.22) 0 2px,
  transparent 2px 10px
 ),
 repeating-linear-gradient(
  90deg,
  rgba(255,255,255,.22) 0 2px,
  transparent 2px 10px
 ),
 rgba(220,30,50,.55);
 border:4px solid #ff4757;
}

.net.blue{
 left:2%;
 background:
 repeating-linear-gradient(
  0deg,
  rgba(255,255,255,.22) 0 2px,
  transparent 2px 10px
 ),
 repeating-linear-gradient(
  90deg,
  rgba(255,255,255,.22) 0 2px,
  transparent 2px 10px
 ),
 rgba(35,100,220,.55);
 border:4px solid #4287ff;
}

/* اللاعبون */

.player{
 position:absolute;
 width:56px;
 height:86px;
 z-index:8;
 border-radius:30px;
 box-shadow:0 7px 14px rgba(0,0,0,.35);
}

.player.red{
 background:linear-gradient(#ff5757,#b91628);
}

.player.blue{
 background:linear-gradient(#529bff,#174da7);
}

.player .head{
 position:absolute;
 width:29px;
 height:29px;
 border-radius:50%;
 background:#f2c39b;
 top:-25px;
 left:50%;
 transform:translateX(-50%);
 border:2px solid rgba(0,0,0,.25);
}

.player .body{
 position:absolute;
 left:10px;
 right:10px;
 top:20px;
 bottom:12px;
 border-radius:17px;
 background:rgba(255,255,255,.12);
}

.playerName{
 position:absolute;
 bottom:-27px;
 left:50%;
 transform:translateX(-50%);
 white-space:nowrap;
 font-size:13px;
 font-weight:bold;
 background:rgba(0,0,0,.55);
 padding:4px 8px;
 border-radius:8px;
}

/* المضارب */

.paddle{
 position:absolute;
 width:18px;
 height:55px;
 border-radius:50% 50% 42% 42%;
 z-index:10;
 box-shadow:0 5px 10px rgba(0,0,0,.35);
 transform-origin:bottom center;
}

.paddle:after{
 content:"";
 position:absolute;
 width:7px;
 height:27px;
 background:#7b4b2a;
 bottom:-22px;
 left:50%;
 transform:translateX(-50%);
 border-radius:5px;
}

.paddle.red{
 background:#ef3340;
 border:3px solid #fff;
}

.paddle.blue{
 background:#2775e8;
 border:3px solid #fff;
}

/* الكرة */

#ball{
 position:absolute;
 width:22px;
 height:22px;
 border-radius:50%;
 background:
 radial-gradient(circle at 30% 25%,#fff,#f6f6f6 40%,#c8c8c8);
 border:2px solid #fff;
 box-shadow:
 0 0 12px rgba(255,255,255,.8),
 0 5px 10px rgba(0,0,0,.45);
 z-index:20;
 pointer-events:none;
}

/* تأثير الكرة */

#ballTrail{
 position:absolute;
 width:12px;
 height:12px;
 border-radius:50%;
 background:rgba(255,255,255,.25);
 pointer-events:none;
 z-index:19;
}

/* رسالة */

#message{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 z-index:30;
 background:rgba(0,0,0,.72);
 border:1px solid rgba(255,255,255,.25);
 border-radius:18px;
 padding:18px 24px;
 text-align:center;
 font-size:20px;
 font-weight:bold;
 min-width:220px;
}

/* أزرار اللعب */

.gameButtons{
 width:min(1000px,100%);
 margin:8px auto 0;
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
}

.gameButtons button{
 min-width:105px;
}

.hitBtn{
 background:#86efac;
 color:#052e16;
}

.strongBtn{
 background:#ffd54a;
 color:#241d00;
}

.pauseBtn{
 background:#fca5a5;
 color:#450a0a;
}

/* شاشة النهاية */

#result{
 position:absolute;
 inset:0;
 z-index:40;
 display:none;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.58);
 padding:15px;
}

.resultBox{
 width:min(430px,94%);
 background:#102b40;
 border:2px solid rgba(255,255,255,.25);
 border-radius:20px;
 padding:20px;
 text-align:center;
 box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.resultBox h2{
 margin-top:0;
}

.resultButtons{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:6px;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px){

 #menu{
  padding:10px;
 }

 .menuBox{
  padding:14px;
  border-radius:18px;
 }

 h1{
  font-size:27px;
 }

 .subtitle{
  font-size:14px;
 }

 .section{
  padding:11px;
 }

 .option{
  min-width:80px;
  font-size:14px;
  padding:10px 8px;
 }

 #field{
  height:65vh;
  min-height:360px;
  border-radius:14px;
 }

 .net{
  width:54px;
 }

 .player{
  width:46px;
  height:70px;
 }

 .paddle{
  width:16px;
  height:47px;
 }

 #ball{
  width:20px;
  height:20px;
 }

 .hudBox{
  font-size:13px;
  padding:6px 8px;
 }

 .gameButtons button{
  min-width:85px;
  padding:9px 10px;
  font-size:14px;
 }

}

/* لا يوجد أي إجبار على الوضع الأفقي */

@media(orientation:portrait){

 #field{
  height:64vh;
  min-height:350px;
 }

}

</style>
</head>

<body>

<!-- =========================
     القائمة الرئيسية
========================= -->

<div id="menu">

 <div class="menuBox">

  <h1>🎾 الحائط الصعب</h1>

  <p class="subtitle">
   اضرب الكرة في الحائط ودافع عن شبكتك
  </p>

  <div class="section">

   <div class="sectionTitle">
    ⚙️ إعداد المباراة
   </div>

   <div class="field">

    <label>
     اسم اللاعب الأحمر
    </label>

    <input
     id="redName"
     type="text"
     value="أحمد"
     maxlength="15">

   </div>

   <div class="field">

    <label>
     اسم اللاعب الأزرق
    </label>

    <input
     id="blueName"
     type="text"
     value="محمد"
     maxlength="15">

   </div>

  </div>


  <div class="section">

   <div class="sectionTitle">
    نوع اللعب
   </div>

   <div class="options">

    <button
     id="pvp"
     class="option selected"
     type="button">
     👥 لاعبان
    </button>

    <button
     id="cpu"
     class="option"
     type="button">
     🤖 ضد الكمبيوتر
    </button>

   </div>

  </div>


  <div class="section">

   <div class="sectionTitle">
    المدة
   </div>

   <div class="options">

    <button
     class="option timeOption selected"
     data-time="60"
     type="button">
     60 ثانية
    </button>

    <button
     class="option timeOption"
     data-time="90"
     type="button">
     90 ثانية
    </button>

    <button
     class="option timeOption"
     data-time="120"
     type="button">
     120 ثانية
    </button>

   </div>

  </div>


  <div class="section">

   <div class="sectionTitle">
    الصعوبة
   </div>

   <div class="options">

    <button
     id="easy"
     class="option selected"
     type="button">
     🟢 سهل
    </button>

    <button
     id="medium"
     class="option"
     type="button">
     🟡 متوسط
    </button>

    <button
     id="hard"
     class="option"
     type="button">
     ⚪ صعب
    </button>

   </div>

  </div>


  <div class="section">

   <div class="sectionTitle">
    🏓 سرعة المضرب
   </div>

   <div class="rangeLine">

    <input
     id="paddleSpeed"
     type="range"
     min="4"
     max="12"
     value="7">

    <span
     id="paddleSpeedValue"
     class="rangeValue">
     7
    </span>

   </div>

  </div>


  <div class="section">

   <div class="sectionTitle">
    ⚡ سرعة الكرة
   </div>

   <div class="rangeLine">

    <input
     id="ballSpeed"
     type="range"
     min="3"
     max="9"
     value="5">

    <span
     id="ballSpeedValue"
     class="rangeValue">
     5
    </span>

   </div>

  </div>


  <button
   id="startBtn"
   class="startBtn"
   type="button">
   ▶️ ابدأ اللعب
  </button>


  <div class="infoButtons">

   <button
    id="rulesBtn"
    class="secondary"
    type="button">
    📖 القواعد
   </button>

   <button
    id="soundBtn"
    type="button">
    🔊 الصوت: تشغيل
   </button>

   <button
    id="aboutBtn"
    type="button">
    ℹ️ عن اللعبة
   </button>

  </div>


  <a
   class="homeLink"
   href="../">
   🏠 العودة إلى منصة سامي للألعاب
  </a>

 </div>

</div>


<!-- =========================
     شاشة اللعبة
========================= -->

<div id="game">

 <div class="hud">

  <div class="hudBox redText">
   🔴 <span id="redHud">أحمد</span>:
   <span id="redScore">0</span>
  </div>

  <div class="hudBox">
   🏆 المرحلة:
   <span id="stageHud">1</span>
  </div>

  <div class="hudBox">
   الجولة:
   <span id="roundHud">1</span>/3
  </div>

  <div class="hudBox">
   ⏱️ <span id="timeHud">60</span>
  </div>

  <div class="hudBox blueText">
   🔵 <span id="blueHud">محمد</span>:
   <span id="blueScore">0</span>
  </div>

 </div>


 <div class="controlsTop">

  <button
   id="pauseBtn"
   class="pauseBtn"
   type="button">
   ⏸️ إيقاف
  </button>

  <button
   id="restartBtn"

   🔄 إعادة
  </button>

  <button
   id="gameSoundBtn"
   type="button">
   🔊 الصوت
  </button>

  <button
   id="gameRulesBtn"
   type="button">
   📖 القواعد
  </button>

  <button
   id="gameHomeBtn"
   type="button">
   🏠 القائمة
  </button>

 </div>


 <div id="field">

  <div id="wall">
   <div class="wallMark"></div>
  </div>

  <div class="floorLine"></div>

  <div class="net red"></div>

  <div class="net blue"></div>


  <div
   id="redPlayer"
   class="player red">

   <div class="head"></div>
   <div class="body"></div>

   <div
    id="redPlayerName"
    class="playerName">
    أحمد
   </div>

  </div>


  <div
   id="bluePlayer"
   class="player blue">

   <div class="head"></div>
   <div class="body"></div>

   <div
    id="bluePlayerName"
    class="playerName">
    محمد
   </div>

  </div>


  <div
   id="redPaddle"
   class="paddle red">
  </div>

  <div
   id="bluePaddle"
   class="paddle blue">
  </div>


  <div id="ball"></div>

  <div id="ballTrail"></div>


  <div id="message">
   اضغط ▶️ ابدأ
  </div>


  <div id="result">

   <div class="resultBox">

    <h2 id="resultTitle">
     🏆 النتيجة
    </h2>

    <p id="resultText"></p>

    <div class="resultButtons">

     <button
      id="nextRoundBtn"
      class="startBtn"
      type="button">
      ▶️ الجولة التالية
     </button>

     <button
      id="resultRestartBtn"
      type="button">
      🔄 إعادة المرحلة
     </button>

     <button
      id="resultMenuBtn"
      type="button">
      🏠 القائمة
     </button>

    </div>

   </div>

  </div>

 </div>


 <div class="gameButtons">

  <button
   id="hitBtn"
   class="hitBtn"
   type="button">
   🏓 اضرب
  </button>

  <button
   id="strongBtn"
   class="strongBtn"
   type="button">
   💥 ضربة قوية
  </button>

 </div>

</div>


<script>

/* =========================
   المتغيرات
========================= */

let mode="pvp";

let matchTime=60;

let difficulty="easy";

let paddleSpeed=7;

let baseBallSpeed=5;

let soundOn=true;

let running=false;

let paused=false;

let round=1;

let stage=1;

let redScore=0;

let blueScore=0;

let roundRed=0;

let roundBlue=0;

let timeLeft=60;

let timer=null;

let animation=0;

let lastTime=0;

let ballMoving=false;

let ballVX=0;

let ballVY=0;

let strongHit=false;

let serveSide="red";

let redPointer=null;

let bluePointer=null;

let audioContext=null;


/* =========================
   عناصر
========================= */

const menu=
 document.getElementById("menu");

const game=
 document.getElementById("game");

const field=
 document.getElementById("field");

const ball=
 document.getElementById("ball");

const trail=
 document.getElementById("ballTrail");

const redPlayer=
 document.getElementById("redPlayer");

const bluePlayer=
 document.getElementById("bluePlayer");

const redPaddle=
 document.getElementById("redPaddle");

const bluePaddle=
 document.getElementById("bluePaddle");

const message=
 document.getElementById("message");

const result=
 document.getElementById("result");


/* =========================
   اختيار الإعدادات
========================= */

document.getElementById("pvp").onclick=()=>{
 mode="pvp";

 document.getElementById("pvp")
  .classList.add("selected");

 document.getElementById("cpu")
  .classList.remove("selected");

 document.getElementById("blueName").disabled=false;
};

document.getElementById("cpu").onclick=()=>{
 mode="cpu";

 document.getElementById("cpu")
  .classList.add("selected");

 document.getElementById("pvp")
  .classList.remove("selected");

 document.getElementById("blueName").value="الكمبيوتر";
 document.getElementById("blueName").disabled=true;
};


document.querySelectorAll(".timeOption")
.forEach(btn=>{

 btn.onclick=()=>{

  document.querySelectorAll(".timeOption")
   .forEach(x=>x.classList.remove("selected"));

  btn.classList.add("selected");

  matchTime=
   Number(btn.dataset.time);

 };

});


document.getElementById("easy").onclick=()=>{
 difficulty="easy";

 selectDifficulty("easy");
};

document.getElementById("medium").onclick=()=>{
 difficulty="medium";

 selectDifficulty("medium");
};

document.getElementById("hard").onclick=()=>{
 difficulty="hard";

 selectDifficulty("hard");
};


function selectDifficulty(id){

 ["easy","medium","hard"].forEach(x=>{
  document.getElementById(x)
   .classList.remove("selected");
 });

 document.getElementById(id)
  .classList.add("selected");
}


document.getElementById("paddleSpeed")
.oninput=e=>{

 paddleSpeed=
  Number(e.target.value);

 document.getElementById(
  "paddleSpeedValue"
 ).textContent=
  paddleSpeed;

};


document.getElementById("ballSpeed")
.oninput=e=>{

 baseBallSpeed=
  Number(e.target.value);

 document.getElementById(
  "ballSpeedValue"
 ).textContent=
  baseBallSpeed;

};


/* =========================
   الصوت
========================= */

function initAudio(){

 if(!soundOn)return;

 try{

  if(!audioContext){

   audioContext=
    new (window.AudioContext||
         window.webkitAudioContext)();

  }

  if(audioContext.state==="suspended")
   audioContext.resume();

 }catch(e){}

}


function beep(
 frequency=440,
 duration=.08,
 type="sine"
){

 if(!soundOn)return;

 initAudio();

 if(!audioContext)return;

 try{

  const osc=
   audioContext.createOscillator();

  const gain=
   audioContext.createGain();

  osc.type=type;

  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
   .0001,
   audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
   .12,
   audioContext.currentTime+.01
  );

  gain.gain.exponentialRampToValueAtTime(
   .0001,
   audioContext.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start();

  osc.stop(
   audioContext.currentTime+duration+.02
  );

 }catch(e){}

}


function toggleSound(){

 soundOn=!soundOn;

 const text=
  soundOn
  ?
  "🔊 الصوت: تشغيل"
  :
  "🔇 الصوت: إيقاف";

 document.getElementById(
  "soundBtn"
 ).textContent=text;

 document.getElementById(
  "gameSoundBtn"
 ).textContent=text;

 if(soundOn)
  beep(650,.08);

}


/* =========================
   القواعد

/* =========================
   مواضع العناصر
========================= */

function fieldSize(){

 return {
  w:field.clientWidth,
  h:field.clientHeight
 };

}


let redX=0;
let redY=0;

let blueX=0;
let blueY=0;

let ballX=0;
let ballY=0;


function placePlayers(){

 const {w,h}=fieldSize();

 redX=
  Math.max(
   20,
   w*.23
  );

 redY=
  h*.68;

 blueX=
  Math.min(
   w-75,
   w*.70
  );

 blueY=
  h*.68;

 setPlayerPosition();

}


function setPlayerPosition(){

 redPlayer.style.left=
  (redX-28)+"px";

 redPlayer.style.top=
  (redY-43)+"px";

 bluePlayer.style.left=
  (blueX-28)+"px";

 bluePlayer.style.top=
  (blueY-43)+"px";


 redPaddle.style.left=
  (redX+25)+"px";

 redPaddle.style.top=
  (redY-35)+"px";


 bluePaddle.style.left=
  (blueX-43)+"px";

 bluePaddle.style.top=
  (blueY-35)+"px";

}


/* =========================
   الكرة
========================= */

function resetBall(){

 const {w,h}=fieldSize();

 ballX=
  serveSide==="red"
  ?
  w*.31
  :
  w*.69;

 ballY=
  h*.52;

 ballVX=
  serveSide==="red"
  ?
  baseBallSpeed
  :
  -baseBallSpeed;

 ballVY=
  (Math.random()-.5)*
  baseBallSpeed;

 ballMoving=true;

 strongHit=false;

 setBall();

}


function setBall(){

 ball.style.left=
  (ballX-11)+"px";

 ball.style.top=
  (ballY-11)+"px";

 trail.style.left=
  (ballX-6)+"px";

 trail.style.top=
  (ballY-6)+"px";

}


/* =========================
   بداية المباراة
========================= */

function startGame(){

 initAudio();

 const redName=
  document.getElementById(
   "redName"
  ).value.trim()||"أحمد";

 const blueName=
  mode==="cpu"
  ?
  "الكمبيوتر"
  :
  document.getElementById(
   "blueName"
  ).value.trim()||"محمد";


 document.getElementById(
  "redHud"
 ).textContent=redName;

 document.getElementById(
  "blueHud"
 ).textContent=blueName;

 document.getElementById(
  "redPlayerName"
 ).textContent=redName;

 document.getElementById(
  "bluePlayerName"
 ).textContent=blueName;


 stage=1;
 round=1;

 redScore=0;
 blueScore=0;

 roundRed=0;
 roundBlue=0;

 matchTime=
  Number(
   document.querySelector(
    ".timeOption.selected"
   )?.dataset.time||60
  );

 difficulty=
  document.querySelector(
   "#hard.selected"
  )
  ?
  "hard"
  :
  document.querySelector(
   "#medium.selected"
  )
  ?
  "medium"
  :
  "easy";


 updateHud();


 menu.style.display="none";
 game.style.display="block";

 result.style.display="none";

 running=true;
 paused=false;

 timeLeft=matchTime;

 placePlayers();

 serveSide=
  round%2===1
  ?
  "red"
  :
  "blue";

 resetBall();

 message.textContent=
  "🎾 ابدأ اللعب!";

 setTimeout(()=>{
  if(running)
   message.style.display="none";
 },900);

 startTimer();

 cancelAnimationFrame(animation);

 lastTime=performance.now();

 animation=
  requestAnimationFrame(loop);

}


/* =========================
   المؤقت
========================= */

function startTimer(){

 clearInterval(timer);

 timer=
 setInterval(()=>{

  if(!running||paused)return;

  timeLeft--;

  if(timeLeft<0)
   timeLeft=0;

  document.getElementById(
   "timeHud"
  ).textContent=timeLeft;

  if(timeLeft<=0){

   clearInterval(timer);

   endRound();

  }

 },1000);

}


/* =========================
   الحلقة
========================= */

function loop(now){

 if(!running){

  return;

 }

 animation=
  requestAnimationFrame(loop);

 if(paused)
  return;

 const dt=
  Math.min(
   2,
   (now-lastTime)/16.67
  );

 lastTime=now;

 updateBall(dt);

 updateCPU(dt);

 setPlayerPosition();

}


/* =========================
   حركة الكرة
========================= */

function updateBall(dt){

 if(!ballMoving)return;

 const {w,h}=fieldSize();

 ballX+=ballVX*dt;
 ballY+=ballVY*dt;


 /* أعلى الشاشة */

 if(ballY<75){

  ballY=75;

  ballVY=Math.abs(ballVY);

  beep(500,.05);

 }


 /* أسفل الشاشة */

 if(ballY>h-20){

  ballY=h-20;

  ballVY=-Math.abs(ballVY);

  beep(350,.05);

 }


 /* جوانب */

 if(ballX<12){

  ballX=12;

  ballVX=Math.abs(ballVX);

 }

 if(ballX>w-12){

  ballX=w-12;

  ballVX=-Math.abs(ballVX);

 }


 /* الحائط */

 const wallTop=8;
 const wallBottom=60;

 if(
  ballY>=wallTop &&
  ballY<=wallBottom &&
  ballX>w*.02 &&
  ballX<w*.98 &&
  Math.abs(ballVY)<20
 ){

  ballVY=
   Math.abs(ballVY)+
   .4;

  beep(700,.07,"square");

 }


 /* مضرب أحمر */

 if(
  ballVX<0 &&
  Math.abs(ballX-(redX+30))<28 &&
  Math.abs(ballY-redY)<55
 ){

  hitBall("red");

 }


 /* مضرب أزرق */

 if(
  ballVX>0 &&
  Math.abs(ballX-(blueX-30))<28 &&
  Math.abs(ballY-blueY)<55
 ){

  hitBall("blue");

 }


 /* دخول الشبكة الحمراء */

 if(
  ballX>w*.90 &&
  ballY>h*.16 &&
  ballY<h*.86
 ){

  scorePoint("blue");

  return;

 }


 /* دخول الشبكة الزرقاء */

 if(
  ballX<w*.10 &&
  ballY>h*.16 &&
  ballY<h*.86
 ){

  scorePoint("red");

  return;

 }


 setBall();

}


/* =========================
   ضرب الكرة
========================= */

function hitBall(side,force=false){

 if(
  side==="red" &&
  ballVX>=0
 )return;

 if(
  side==="blue" &&
  ballVX<=0
 )return;

 const speed=
  Math.max(
   3,
   Math.sqrt(
    ballVX*ballVX+
    ballVY*ballVY
   )
  );

 const boost=
  force||strongHit
  ?
  1.65
  :
  1.12;

 const newSpeed=
  Math.min(
   18,
   speed*boost
  );

 ballVX=
  side==="red"
  ?
  Math.abs(ballVX)*boost
  :
  -Math.abs(ballVX)*boost;

 ballVY+=
  (Math.random()-.5)*2.5;

 const current=
  Math.sqrt(
   ballVX*ballVX+
   ballVY*ballVY
  );

 if(current>newSpeed){

  const ratio=
   newSpeed/current;

  ballVX*=ratio;
  ballVY*=ratio;

 }

 ballVX=
  side==="red"
  ?
  Math.abs(ballVX)
  :
  -Math.abs(ballVX);

 strongHit=false;

 beep(
  force?950:620,
  force?.13:.07,
  force?"sawtooth":"square"
 );

}


/* =========================
   زر الضرب
========================= */

function manualHit(force=false){

 if(!running||paused)
  return;

 const side=
  ballX<field.clientWidth/2
  ?
  "red"
  :
  "blue";

 if(
  side==="red" &&
  ballVX<0 &&
  Math.abs(ballX-(redX+30))<80 &&
  Math.abs(ballY-redY)<85
 ){

  hitBall("red",force);
  return;

 }

 if(
  side==="blue" &&
  ballVX>0 &&
  Math.abs(ballX-(blueX-30))<80 &&
  Math.abs(ballY-blueY)<85
 ){

  hitBall("blue",force);
  return;

 }

}


/* =========================
   الكمبيوتر
========================= */

function updateCPU(dt){

 if(mode!=="cpu")
  return;

 if(!running||paused)
  return;

 const {h}=fieldSize();

 let target=
  ballY;

 if(ballVX>0){

  const level=
   difficulty==="easy"
   ? .035
   :
   difficulty==="medium"
   ? .065
   :
   .10;

  blueY+=
   (target-blueY)*
   level*
   dt;

 }else{

  const center=
   h*.67;

  blueY+=
   (center-blueY)*
   .025*
   dt;

 }

 const limitTop=110;
 const limitBottom=h-75;

 blueY=
  Math.max(
   limitTop,
   Math.min(
    limitBottom,
    blueY
   )
  );

 /* الكمبيوتر يضرب تلقائيًا */

 if(
  ballVX>0 &&
  Math.abs(ballX-(blueX-30))<55 &&
  Math.abs(ballY-blueY)<65
 ){

  const chance=
   difficulty==="easy"
   ? .025
   :
   difficulty==="medium"
   ? .055
   :
   .09;

  if(Math.random()<chance*dt)
   hitBall("blue");

 }

}


/* =========================
   تسجيل النقطة
========================= */

function scorePoint(side){

 if(side==="red"){

  redScore++;
  roundRed++;

 }else{

  blueScore++;
  roundBlue++;

 }

 updateHud();

 beep(
  side==="red"?850:450,
  .16,
  "triangle"
 );

 ballMoving=false;

 message.style.display="block";

 message.textContent=
  side==="red"
  ?
  "🔴 نقطة للأحمر!"
  :
  "🔵 نقطة للأزرق!";

 setTimeout(()=>{

  if(!running)return;

  serveSide=
   side;

  resetBall();

  message.style.display="none";

 },650);

}


/* =========================
   تحديث HUD
========================= */

function updateHud(){

 document.getElementById(
  "redScore"
 ).textContent=redScore;

 document.getElementById(
  "blueScore"
 ).textContent=blueScore;

 document.getElementById(
  "stageHud"
 ).textContent=stage;

 document.getElementById(
  "roundHud"
 ).textContent=round+"/3";

 document.getElementById(
  "timeHud"
 ).textContent=timeLeft;

}


/* =========================
   نهاية الجولة
========================= */

function endRound(){

 ballMoving=false;

 message.style.display="block";

 let text="";

 if(roundRed>roundBlue){

  text=
   "🔴 الأحمر فاز بالجولة!";

 }else if(roundBlue>roundRed){

  text=
   "🔵 الأزرق فاز بالجولة!";

 }else{

  text=
   "🤝 الجولة انتهت بالتعادل!";

 }

 message.textContent=text;

 beep(900,.18,"triangle");

 setTimeout(()=>{

  if(!running)return;

  if(round>=3){

   endStage();

  }else{

   round++;

   roundRed=0;
   roundBlue=0;

   timeLeft=matchTime;

   updateHud();

   serveSide=
    round%2===1
    ?
    "red"
    :
    "blue";

   resetBall();

   message.style.display="none";

   startTimer();

  }

 },900);

}


/* =========================
   نهاية المرحلة
========================= */

function endStage(){

 running=false;

 clearInterval(timer);

 cancelAnimationFrame(animation);

 result.style.display="flex";

 let title="🏆 نهاية المرحلة";

 if(redScore>blueScore){

  title="🔴 الأحمر يتصدر";

 }else if(blueScore>redScore){

  title="🔵 الأزرق يتصدر";

 }else{

  title="🤝 تعادل";

 }

 document.getElementById(
  "resultTitle"
 ).textContent=title;

 document.getElementById(
  "resultText"
 ).textContent=
 `المرحلة ${stage}
النتيجة النهائية:
🔴 ${redScore} — ${blueScore} 🔵

يمكنك الانتقال للمرحلة التالية.`;

 beep(1100,.25,"triangle");

}


/* =========================
   المرحلة التالية
========================= */

function nextStage(){

 stage++;

 round=1;

 roundRed=0;
 roundBlue=0;

 redScore=0;
 blueScore=0;

 timeLeft=matchTime;

 result.style.display="none";

 running=true;
 paused=false;

 updateHud();

 placePlayers();

 serveSide="red";

 resetBall();

 message.style.display="block";

 message.textContent=
  "🏆 المرحلة "+stage;

 setTimeout(()=>{

  if(running)
   message.style.display="none";

 },800);

 startTimer();

 lastTime=performance.now();

 animation=
  requestAnimationFrame(loop);

}


/* =========================
   إعادة المباراة
========================= */

function restartGame(){

 result.style.display="none";

 running=false;

 clearInterval(timer);

 cancelAnimationFrame(animation);

 setTimeout(()=>{
  startGame();
 },20);

}


/* =========================
   القائمة
========================= */

function backMenu(){

 running=false;
 paused=false;

 clearInterval(timer);

 cancelAnimationFrame(animation);

 result.style.display="none";

 game.style.display="none";

 menu.style.display="block";

}


/* =========================
   إيقاف
========================= */

function togglePause(){

 if(!running)return;

 paused=!paused;

 document.getElementById(
  "pauseBtn"
 ).textContent=
  paused
  ?
  "▶️ متابعة"
  :
  "⏸️ إيقاف";

 if(paused){

  message.style.display="block";
  message.textContent="⏸️ اللعبة متوقفة";

 }else{

  message.style.display="none";
  lastTime=performance.now();

 }

}


/* =========================
   تحكم اللمس والسحب
========================= */

function movePlayerFromPointer(
 pointerId,
 x,
 y
){

 const rect=
  field.getBoundingClientRect();

 const fx=
  x-rect.left;

 const fy=
  y-rect.top;

 if(
  fx<rect.width/2
 ){

  redX=
   Math.max(
    50,
    Math.min(
     rect.width*.47,
     fx
    )
   );

  redY=
   Math.max(
    110,
    Math.min(
     rect.height-75,
     fy
    )
   );

 }else{

  if(mode==="pvp"){

   blueX=
    Math.max(
     rect.width*.53,
     Math.min(
      rect.width-50,
      fx
     )
    );

   blueY=
    Math.max(
     110,
     Math.min(
      rect.height-75,
      fy
     )
    );

  }

 }

 setPlayerPosition();

}


field.addEventListener(
 "pointerdown",
 e=>{

  if(!running||paused)
   return;

  try{
   field.setPointerCapture(e.pointerId);
  }catch(x){}

  movePlayerFromPointer(
   e.pointerId,
   e.clientX,
   e.clientY
  );

 }
);


field.addEventListener(
 "pointermove",
 e=>{

  if(!running||paused)
   return;

  if(e.buttons===0)
   return;

  movePlayerFromPointer(
   e.pointerId,
   e.clientX,
   e.clientY
  );

 }
);

/* =========================
   تغيير الحجم
========================= */

window.addEventListener(
 "resize",
 ()=>{

  if(game.style.display!=="none"){

   const {w,h}=fieldSize();

   redX=
    Math.max(
     45,
     Math.min(
      w*.47,
      redX
     )
    );

   blueX=
    Math.max(
     w*.53,
     Math.min(
      w-45,
      blueX
     )
    );

   redY=
    Math.max(
     110,
     Math.min(
      h-75,
      redY
     )
    );

   blueY=
    Math.max(
     110,
     Math.min(
      h-75,
      blueY
     )
    );

   setPlayerPosition();
   setBall();

  }

 }
);

========================= */

document.getElementById(

).disabled=false;
